services:
  postgres:
    image: postgres:16
    container_name: fotosnap_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fotosnap
    ports:
      - "5432:5432"
    volumes:
      - fotosnap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fotosnap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fotosnap_postgres_data:
